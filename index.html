<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite English | المستوى الأول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #07090e;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .main-card {
            background: #064e3b;
            border: 3px solid #e2b714;
            border-radius: 28px;
            width: 100%;
            max-width: 900px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            text-align: center;
        }

        h1 {
            color: #e2b714;
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: #d1fae5;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .option-box {
            background: #ffffff;
            color: #0f172a;
            padding: 25px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-right: 8px solid #e2b714;
            text-align: right;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .option-box:hover {
            transform: translateY(-5px);
            background: #fffdf5;
        }

        .option-box h3 {
            font-size: 1.3rem;
            font-weight: 900;
            color: #0f172a;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .option-box p {
            color: #475569;
            font-size: 1rem;
        }

        /* قسم الألعاب والأرقام (1 إلى 16) */
        .games-section, .video-section {
            display: none;
            margin-top: 20px;
        }

        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .num-btn {
            background: #043927;
            border: 2px solid #e2b714;
            color: #fff;
            font-size: 1.8rem;
            font-weight: 900;
            padding: 20px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.3s;
        }

        .num-btn:hover {
            background: #e2b714;
            color: #07090e;
        }

        /* حاوية الفيديو */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .back-btn {
            background: #e2b714;
            color: #07090e;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 900;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .back-btn:hover {
            opacity: 0.9;
        }

        /* نافذة لعبة السؤال والصور */
        .game-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-content {
            background: #064e3b;
            border: 3px solid #e2b714;
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .game-content h2 {
            color: #e2b714;
            font-size: 1.6rem;
            margin-bottom: 20px;
        }

        .game-options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }

        .choice-btn {
            background: #ffffff;
            color: #0f172a;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .choice-btn:hover {
            background: #f1f5f9;
            border: 2px solid #e2b714;
        }

        @media (max-width: 600px) {
            .numbers-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <!-- القائمة الرئيسية -->
        <div id="mainMenuView">
            <h1>المستوى الأول (الأساسيات)</h1>
            <p class="subtitle">اختر القسم المطلوب للانتقال للشرح أو الألعاب التفاعلية</p>
            
            <div class="options-grid">
                <div class="option-box" onclick="showVideoSection()">
                    <h3>تقنية الشادونق (فيديو) <i class="fa-solid fa-play-circle" style="color:#064e3b;"></i></h3>
                    <p>مقطع يوتيوب لتدريب اللسان والتقليد الصوتي الصحيح.</p>
                </div>

                <div class="option-box" onclick="showGamesSection()">
                    <h3>الألعاب والتحديات التفاعلية (1-16) <i class="fa-solid fa-gamepad" style="color:#064e3b;"></i></h3>
                    <p>اختبر معلوماتك واختر الجمل والصور المناسبة لكل رقم.</p>
                </div>
            </div>
        </div>

        <!-- قسم الألعاب (1 إلى 16) -->
        <div id="gamesSection" class="games-section">
            <h2 style="color: #e2b714; margin-bottom: 20px;">ألعاب الأرقام والتحدي</h2>
            <div class="numbers-grid">
                <button class="num-btn" onclick="openGame('they are playing football', 'كرة القدم', 'ركوب الدراجات', 'السباحة')">1</button>
                <button class="num-btn" onclick="openGame('she is cooking', 'الطبيخ والمطبخ', 'القراءة', 'النوم')">2</button>
                <button class="num-btn" onclick="openGame('he is reading a book', 'قراءة كتاب', 'جري سريع', 'شرب القهوة')">3</button>
                <button class="num-btn" onclick="openGame('she is drinking coffee', 'شرب القهوة', 'القيادة', 'التلفاز')">4</button>
                <button class="num-btn" onclick="openGame('he is driving a car', 'قيادة السيارة', 'السباحة', 'الرسم')">5</button>
                <button class="num-btn" onclick="openGame('they are studying english', 'دراسة الإنجليزية', 'تنظيف الغرفة', 'السفر')">6</button>
                <button class="num-btn" onclick="openGame('she is listening to music', 'الاستماع للموسيقى', 'الكتابة', 'الطبخ')">7</button>
                <button class="num-btn" onclick="openGame('he is running fast', 'الجري السريع', 'لعب كرة القدم', 'قراءة')">8</button>
                <button class="num-btn" onclick="openGame('they are eating dinner', 'تناول العشاء', 'شرب القهوة', 'النوم')">9</button>
                <button class="num-btn" onclick="openGame('she is writing a letter', 'كتابة رسالة', 'الرسم', 'القيادة')">10</button>
                <button class="num-btn" onclick="openGame('he is swimming in pool', 'السباحة في المسبح', 'الجري', 'السفر')">11</button>
                <button class="num-btn" onclick="openGame('they are watching tv', 'مشاهدة التلفاز', 'دراسة', 'طبخ')">12</button>
                <button class="num-btn" onclick="openGame('she is painting a picture', 'رسم لوحة', 'كتابة', 'استماع')">13</button>
                <button class="num-btn" onclick="openGame('he is cleaning the room', 'تنظيف الغرفة', 'لعب', 'قيادة')">14</button>
                <button class="num-btn" onclick="openGame('they are traveling by plane', 'السفر بالطائرة', 'السباحة', 'الجري')">15</button>
                <button class="num-btn" onclick="openGame('she is sleeping now', 'النوم الآن', 'القراءة', 'الطبخ')">16</button>
            </div>
            <button class="back-btn" onclick="goBackToMain()">العودة للقائمة الرئيسية</button>
        </div>

        <!-- قسم الفيديو -->
        <div id="videoSection" class="video-section">
            <h2 style="color: #e2b714; margin-bottom: 20px;">تقنية الشادونق</h2>
            <div class="video-container">
                <iframe id="ytIframe" src="" allowfullscreen></iframe>
            </div>
            <button class="back-btn" onclick="goBackToMain()">العودة للقائمة الرئيسية</button>
        </div>
    </div>

    <!-- نافذة اللعبة التفاعلية -->
    <div id="gameModal" class="game-modal">
        <div class="game-content">
            <h2 id="modalSentence">الجملة هنا</h2>
            <div class="game-options-list" id="modalChoices">
                <!-- الخيارات تتعبى تلقائياً -->
            </div>
            <button class="back-btn" onclick="closeGameModal()">إغلاق</button>
        </div>
    </div>

    <script>
        function showGamesSection() {
            document.getElementById('mainMenuView').style.display = 'none';
            document.getElementById('gamesSection').style.display = 'block';
        }

        function showVideoSection() {
            document.getElementById('mainMenuView').style.display = 'none';
            document.getElementById('videoSection').style.display = 'block';
            document.getElementById('ytIframe').src = 'https://www.youtube.com/embed/dQw4w9WgXcQ';
        }

        function goBackToMain() {
            document.getElementById('ytIframe').src = '';
            document.getElementById('gamesSection').style.display = 'none';
            document.getElementById('videoSection').style.display = 'none';
            document.getElementById('mainMenuView').style.display = 'block';
        }

        function openGame(sentence, correct, wrong1, wrong2) {
            document.getElementById('modalSentence').innerText = sentence;
            let choicesContainer = document.getElementById('modalChoices');
            
            // ترتيب عشوائي للخيار الصحيح
            let options = [
                {text: correct, correct: true},
                {text: wrong1, correct: false},
                {text: wrong2, correct: false}
            ].sort(() => Math.random() - 0.5);

            choicesContainer.innerHTML = options.map(opt => `
                <button class="choice-btn" onclick="checkAnswer(${opt.correct})">${opt.text}</button>
            `).join('');

            document.getElementById('gameModal').style.display = 'flex';
        }

        function checkAnswer(isCorrect) {
            if(isCorrect) {
                alert('إجابة صحيحة كفو عليك!');
                closeGameModal();
            } else {
                alert('خطأ، حاول مرة أخرى!');
            }
        }

        function closeGameModal() {
            document.getElementById('gameModal').style.display = 'none';
        }
    </script>
</body>
</html>
